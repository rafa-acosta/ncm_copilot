# Structured control definitions for the Cisco IOS-XE Config Compliance Checker.
#
# Source: support_files/Prompt para VibeCoding.pdf (18 controls). control_00007 does not
# exist in the source document (numbering jumps 00006 -> 00008) and is intentionally
# omitted here rather than renumbered. Six controls carry an additional
# not_compliance_condition beyond the literal source text, added to satisfy the
# acceptance-criteria findings list (TACACS Type 7, permissive VTY ACL, SNMP v2c/v3
# coexistence, inconsistent password hashing, NTP authentication, missing CoPP) --
# see CLAUDE.md section 11 for the rationale behind each addition.

- control_id: control_00001
  title: "Hostname"
  explanation: >
    The hostname has specific characteristics that should be taken into consideration.
    Name parts are separated by an underscore: 1) Company name, 2) Country,
    3) Type - a short device-class code, not the spelled-out word (RT, SW, WLC, AP, PBX, FW, etc.),
    4) Function (mpls, internet, DSL, etc.), 5) Site, 6) Device number.
  command_template: |
    hostname <hostname>
  variables:
    - hostname
    - company_name
    - country
    - type
    - function
    - site
    - device_number
  not_compliance_conditions:
    - "Name does not meet the naming convention (COMPANY_COUNTRY_TYPE_FUNCTION_SITE_DEVICENUMBER)"
    - "Hostname is generic (e.g. router, switch, wireless_controller, access_point)"
    - "Type field spells out the device class instead of using the short code (e.g. 'Router' instead of 'RT')"
  exceptions:
    - "No specific exceptions identified for this control."
  severity: Low
  risk: >
    An inconsistent or generic hostname hinders asset identification, audit logging,
    and security incident response.
  remediation: >
    Configure the hostname following the corporate naming convention:
    hostname <COMPANY>_<COUNTRY>_<TYPE>_<FUNCTION>_<SITE>_<DEVICE_NUMBER>.
  evidence: "The 'hostname' line in the running configuration."
  deterministic_validation: true
  manual_review: false
  config_example: |
    hostname INTEL_CR_RT_INT_BLN_01

- control_id: control_00002
  title: "Domain"
  explanation: >
    This command defines the domain name for the device, which is a required
    parameter for generating cryptographic keys.
  command_template: |
    ip domain name <company_name>
  variables:
    - company_name
  not_compliance_conditions:
    - "Domain name does not match the name assigned by the client."
  exceptions:
    - "In some cases it is not necessary to use a domain."
  severity: Low
  risk: >
    Missing or incorrect domain names prevent the successful generation of RSA keys
    required for secure protocols like SSH.
  remediation: "Apply the correct domain using: ip domain name <company_name>."
  evidence: "The 'ip domain name' command in the running configuration."
  deterministic_validation: true
  manual_review: false
  config_example: |
    ip domain name acme.com

- control_id: control_00003
  title: "AAA"
  explanation: >
    Configures the Authentication, Authorization, and Accounting framework to manage
    user access and activity logging on the device.
  command_template: |
    aaa new-model
    aaa authentication password-prompt LOCAL_PASS:
    aaa authentication username-prompt LOCAL_USER:
    aaa authentication login default group <tacacs_group> local
    aaa authentication enable default group <tacacs_group> enable
    aaa authorization config-commands
    aaa authorization exec default group <tacacs_group> local if-authenticated
    aaa authorization commands 1 default group <tacacs_group> if-authenticated
    aaa authorization commands 15 default group <tacacs_group> if-authenticated
    aaa accounting exec default start-stop group <tacacs_group>
    aaa accounting commands 1 default start-stop group <tacacs_group>
    aaa accounting commands 15 default start-stop group <tacacs_group>
  variables:
    - tacacs_group
  not_compliance_conditions:
    - "One of the required AAA commands is missing"
    - "The TACACS group referenced does not match across all AAA commands"
    - "The TACACS group referenced does not match the corporate group in the golden config"
    - "'aaa new-model' is missing"
  exceptions:
    - "The device being audited specifically indicates that AAA is not needed."
  severity: High
  risk: >
    Incomplete AAA configuration can lead to unauthorized access, lack of
    accountability for administrative actions, and inability to log user sessions.
  remediation: >
    Implement the full AAA suite (Authentication, Authorization, and Accounting)
    pointing to the authorized TACACS group.
  evidence: "All 'aaa' commands in the running configuration."
  deterministic_validation: true
  manual_review: false
  config_example: |
    aaa authentication password-prompt LOCAL_PASS:
    aaa authentication username-prompt LOCAL_USER:
    aaa authentication login default group ACME_TACACS_SERVER_GROUP local
    aaa authentication enable default group ACME_TACACS_SERVER_GROUP enable
    aaa authorization config-commands
    aaa authorization exec default group ACME_TACACS_SERVER_GROUP local if-authenticated
    aaa authorization commands 1 default group ACME_TACACS_SERVER_GROUP if-authenticated
    aaa authorization commands 15 default group ACME_TACACS_SERVER_GROUP if-authenticated
    aaa accounting exec default start-stop group ACME_TACACS_SERVER_GROUP
    aaa accounting commands 1 default start-stop group ACME_TACACS_SERVER_GROUP
    aaa accounting commands 15 default start-stop group ACME_TACACS_SERVER_GROUP

- control_id: control_00004
  title: "TACACS"
  explanation: >
    Establishes communication with external TACACS+ servers to centralize security
    and administrative access control.
  command_template: |
    aaa new-model
    {% for server in tacacs_servers %}
    tacacs server {{ server.name }}
     address ipv4 {{ server.address }}
     key 0 {{ server.key }}
     timeout {{ server.timeout }}
    {% endfor %}
    aaa group server tacacs+ {{ tacacs_group_name }}
    {% for server in tacacs_servers %}
     server name {{ server.name }}
    {% endfor %}
     ip tacacs source-interface {{ source_interface }}
  # Pre-converted Jinja (not the <var> convention used by every other control): this is the
  # one control with a genuinely repeating structure (N TACACS servers), rendered by the
  # Golden Config Creator via a {% for %} loop. See GOLDEN_CONFIG_CREATOR.md section 12.
  variables:
    - tacacs_servers
    - tacacs_group_name
    - source_interface
  not_compliance_conditions:
    - "The commands are not present with the assigned variables (server names, group, source-interface)"
    - "TACACS key is stored using reversible Type 7 encoding instead of Type 6 ('key config-key password-encrypt' + 'key 6 <key>')"
    - "'address ipv4' is missing under a 'tacacs server' block, two TACACS servers share the same address, or an address does not match the corporate value in the golden config (when golden gives a real IP rather than a placeholder)"
    - "A TACACS server's name or timeout does not match the corporate value in the golden config (when golden gives a real value rather than a placeholder)"
    - "A 'server name' reference under 'aaa group server tacacs+' does not correspond to any defined 'tacacs server' block"
  exceptions:
    - "In some cases there is no TACACS server active in the environment. This condition should be indicated prior to device configuration."
    - "Some old IOS versions do not support these commands."
  severity: High
  risk: >
    Failure to communicate with central security servers forces the use of local
    accounts, making user management difficult and less secure across the network.
    A reversible Type 7 TACACS key can be trivially decoded if the configuration is
    disclosed, exposing the shared secret.
  remediation: >
    Define the TACACS+ servers with the appropriate keys and timeouts as specified
    by the security policy, using Type 6 key encryption instead of Type 7.
  evidence: "'tacacs server' definitions and keys in the running configuration."
  deterministic_validation: true
  manual_review: false
  config_example: |
    aaa new-model
    tacacs server ACME_TACACS_01
     address ipv4 192.168.100.100
     key 6 <encrypted_key>
     timeout 10
    tacacs server ACME_TACACS_02
     address ipv4 192.168.100.102
     key 6 <encrypted_key>
     timeout 10
    aaa group server tacacs+ ACME_TACACS_SERVER_GROUP
     server name ACME_TACACS_01
     server name ACME_TACACS_02
     ip tacacs source-interface Loopback0

- control_id: control_00005
  title: "Local and emergency users"
  explanation: >
    Defines local user accounts and privileged mode passwords to ensure device
    access in case of network failure or emergency.
  command_template: |
    username <user> privilege <privilege_level> algorithm-type scrypt secret <password>
  # 'enable secret' is control_00015's line, not this one (see NCM Configuration
  # Script.txt: control_00005's section is the emergency-user username line only).
  variables:
    - user
    - privilege_level
    - password
  not_compliance_conditions:
    - "Username should be present"
    - "Enable secret should be present"
    - "The commands must be executed with the assigned variables"
    - "Local user accounts use inconsistent password-hashing types (mixing type 5/0 with type 8/9), or use the weak type 5/0 hash"
    - "The local emergency user is missing 'algorithm-type scrypt', is not privilege 15, or its name does not match the corporate standard in the golden config"
  exceptions:
    - "No specific exceptions identified for this control."
  severity: High
  risk: >
    Lack of local emergency accounts can result in total loss of access during a
    network or TACACS outage. Weak or inconsistent password-hashing algorithms are
    susceptible to brute-force attacks.
  remediation: >
    Configure a local admin user and 'enable secret' using high-security hashing
    algorithms like scrypt (type 8/9), consistently across all local accounts.
  evidence: "'username' and 'enable secret' lines in the running configuration."
  deterministic_validation: true
  manual_review: false
  config_example: |
    username admin privilege 15 algorithm-type scrypt secret 0123456789

- control_id: control_00006
  title: "SSH"
  explanation: >
    Prerequisites (hostname, domain) plus RSA key generation and SSH hardening
    parameters for secure remote administrative access.
  command_template: |
    crypto key zeroize rsa
    crypto key generate rsa modulus 2048
    ip ssh version <ssh_version>
    ip ssh time-out <ssh_timeout>
    ip ssh authentication-retries <ssh_auth_retries>
  # hostname/domain-name are prerequisites, not rendered here - control_00001/
  # 00002 already own those lines (see NCM Configuration Script.txt: this
  # control's own section has no hostname/domain lines).
  variables:
    - ssh_version
    - ssh_timeout
    - ssh_auth_retries
  not_compliance_conditions:
    - "Hostname is not configured"
    - "IP domain-name is not configured"
    - "RSA key generation (modulus 2048) is missing"
    - "'ip ssh version', 'ip ssh time-out', or 'ip ssh authentication-retries' does not match the corporate value in the golden config"
  exceptions:
    - "No specific exceptions identified for this control."
  severity: High
  risk: >
    Insecure or missing RSA keys prevent encrypted management traffic, leaving
    administrative sessions vulnerable to eavesdropping.
  remediation: >
    Generate RSA keys with a minimum modulus of 2048 bits after setting the
    hostname and domain.
  evidence: "Output of 'show ip ssh' or absence of zeroize commands."
  deterministic_validation: true
  manual_review: false
  config_example: |
    crypto key zeroize rsa
    crypto key generate rsa modulus 2048
    ip ssh version 2
    ip ssh time-out 60
    ip ssh authentication-retries 3

- control_id: control_00007
  title: "Global password encryption"
  explanation: >
    Defines a global AES-128 master key that securely encrypts sensitive passwords
    (TACACS+, RADIUS, routing keys) into Type-6 format within the configuration
    file, preventing them from being read even if a copy of the running-config is
    obtained.
  command_template: |
    key config-key password-encrypt <device_master_key>
    password encryption aes
  variables:
    - device_master_key
  not_compliance_conditions:
    - "The device master key ('key config-key password-encrypt') is not present"
    - "The device master key is set to a weak/guessable value (e.g. all-same-digit, too short, or a known-weak literal)"
    - "'password encryption aes' is not enabled"
  exceptions:
    - "No exceptions identified for this control."
  severity: High
  risk: >
    Without this command, TACACS+/RADIUS/routing keys fall back to weak Type-7
    encoding or cleartext storage, trivially decodable if an attacker obtains
    the running-config, compromising network infrastructure.
  remediation: "Apply 'key config-key password-encrypt <device_master_key>' and 'password encryption aes' on the device."
  evidence: "'key 6 <encrypted_string>' format on sensitive keys in the running configuration, and 'password encryption aes' present."
  deterministic_validation: true
  manual_review: false
  config_example: |
    key config-key password-encrypt 0123456789
    password encryption aes

- control_id: control_00008
  title: "ACL for VTY"
  explanation: >
    Requires a named extended ACL scoping administrative access - its full rule
    content, in order, is validated here against the corporate standard (see
    control_00014 for whether it's actually bound to the VTY lines via
    'access-class').
  command_template: |
    ip access-list extended {{ acl_name }}
    {% for rule in acl_rules %}
     {{ rule }}
    {% endfor %}
  # Pre-converted Jinja (not the <var> convention used by every other control),
  # same pattern as control_00004's TACACS servers: a real repeating list
  # (the corporate ACL's rules/remarks, in order), rendered via a {% for %}
  # loop by the Golden Config Creator. See GOLDEN_CONFIG_CREATOR.md section 12.
  variables:
    - acl_name
    - acl_rules
  not_compliance_conditions:
    - "ACL does not exist"
    - "ACL name does not match the corporate ACL name in the golden config"
    - "ACL rule content or order does not match the corporate standard in the golden config (e.g. a permissive 'permit ip any any' or wildcard-equivalent-to-any rule, or a missing terminal explicit deny-log)"
  exceptions:
    - "No specific exceptions identified for this control."
  severity: High
  risk: >
    Without a correctly-scoped ACL, the equipment is exposed to a security
    breach from unrestricted management-plane reachability.
  remediation: "Apply the corporate-standard ACL content, in order, inside the VTY configuration module."
  evidence: "'ip access-list extended' in the running configuration."
  deterministic_validation: true
  manual_review: false
  config_example: |
    ip access-list extended ACME_VTY_MGMT_ACL
     remark ACME - Deny explicito a rangos de Cloudflare
     deny ip any 173.245.48.0 0.0.15.255
     deny ip any 103.21.244.0 0.0.3.255
     deny ip any 103.22.200.0 0.0.3.255
     deny ip any 103.31.4.0 0.0.3.255
     deny ip any 141.101.64.0 0.0.63.255
     deny ip any 108.162.192.0 0.0.63.255
     deny ip any 190.93.240.0 0.0.15.255
     deny ip any 188.114.96.0 0.0.15.255
     deny ip any 197.234.240.0 0.0.3.255
     deny ip any 198.41.128.0 0.0.127.255
     deny ip any 162.158.0.0 0.1.255.255
     deny ip any 104.16.0.0 0.7.255.255
     deny ip any 104.24.0.0 0.3.255.255
     deny ip any 172.64.0.0 0.7.255.255
     deny ip any 131.0.72.0 0.0.3.255
     remark ACME - Solo se permite trafico SSH
     permit tcp any any eq 22
     permit tcp any eq 22 any
     remark ACME - Deny explicito de cualquier otro protocolo
     deny ip any any log

- control_id: control_00009
  title: "NTP"
  explanation: >
    Configures time synchronization with NTP servers to ensure system logs have
    accurate timestamps.
  command_template: |
    ntp authentication-key <ntp_key_id> md5 <ntp_key_value>
    ntp trusted-key <ntp_key_id>
    ntp authenticate
    ntp server <ntp_ip_address> key <ntp_key_id> prefer
    ntp server <secondary_ntp_ip_address> key <ntp_key_id>
  variables:
    - ntp_ip_address
    - secondary_ntp_ip_address
    - ntp_key_id
    - ntp_key_value
  not_compliance_conditions:
    - "NTP server configuration is missing"
    - "'prefer' keyword is missing on the primary NTP server"
    - "NTP authentication is not configured ('ntp authenticate' / 'ntp authentication-key' / 'ntp trusted-key' missing)"
    - "'ntp trusted-key' does not match 'ntp authentication-key', or an 'ntp server' line does not reference that same key id"
    - "An NTP server IP does not match the corporate value in the golden config"
  exceptions:
    - "No specific exceptions identified for this control."
  severity: Medium
  risk: >
    Drifting clocks lead to inaccurate log timestamps, making forensic analysis and
    event correlation during a security incident nearly impossible. Unauthenticated
    NTP allows time-source spoofing, which can be used to undermine certificate
    validation and log correlation.
  remediation: >
    Configure at least two reliable NTP servers, use the 'prefer' keyword for the
    primary source, and enable NTP authentication.
  evidence: "'ntp server' lines, 'ntp authenticate'/'ntp authentication-key' lines, and 'show ntp associations' output."
  deterministic_validation: true
  manual_review: false
  config_example: |
    ntp authentication-key 1 md5 0123456789
    ntp trusted-key 1
    ntp authenticate
    ntp server 10.10.10.100 key 1 prefer
    ntp server 20.20.20.100 key 1

- control_id: control_00010
  title: "Syslog"
  explanation: >
    Enables sending event logs to an external server for system monitoring,
    auditing, and troubleshooting.
  command_template: |
    logging on
    logging host <ip_syslog_server>
    logging trap informational
    logging source-interface <syslog_interface>
  variables:
    - ip_syslog_server
    - syslog_interface
  not_compliance_conditions:
    - "'logging on' command is missing"
    - "Logging host IP address is missing, or does not match the corporate syslog server in the golden config"
    - "Logging trap level is not set to 'informational'"
    - "'logging source-interface' is not configured correctly"
  exceptions:
    - "No specific exceptions identified for this control."
  severity: Medium
  risk: >
    Without centralized logging, local logs may be overwritten or cleared by an
    attacker, leaving no trace of unauthorized activity.
  remediation: >
    Enable global logging and point it to a secure, external syslog server with an
    informational trap level.
  evidence: "'logging' commands in the running configuration."
  deterministic_validation: true
  manual_review: false
  config_example: |
    logging on
    logging host 30.30.30.100
    logging trap informational
    logging source-interface loopback 0

- control_id: control_00011
  title: "SNMP"
  explanation: >
    Configures the SNMPv3 protocol with encryption and authentication for secure
    management and monitoring of network devices.
  command_template: |
    snmp-server group <group_name> v3 priv
    snmp-server user <user_name> <group_name> v3 auth sha <auth_password> priv aes 128 <priv_password>
    snmp-server host <snmp_server_ip> version 3 priv <user_name>
    snmp-server enable traps
  variables:
    - group_name
    - user_name
    - auth_password
    - priv_password
    - snmp_server_ip
  not_compliance_conditions:
    - "SNMPv3 group with 'priv' is not configured"
    - "SNMPv3 user is not created with SHA/AES configuration"
    - "SNMP trap host is missing"
    - "'snmp-server enable traps' command is missing"
    - "An SNMPv1/v2c community string ('snmp-server community') coexists with the SNMPv3 configuration"
    - "SNMP group name, user name, or trap host does not match the corporate value in the golden config"
    - "'snmp-server user' references a group name that has no matching 'snmp-server group ... v3 priv' definition (referential integrity)"
  exceptions:
    - "No specific exceptions identified for this control."
  severity: High
  risk: >
    SNMPv1/v2c transmit community strings in clear text. SNMPv3 without 'priv'
    lacks encryption, exposing monitoring data and control to interception.
  remediation: >
    Use SNMPv3 with authentication (SHA) and privacy (AES) exclusively; remove any
    SNMPv1/v2c community strings.
  evidence: "'snmp-server' configuration lines and 'show snmp user' output."
  deterministic_validation: true
  manual_review: false
  config_example: |
    snmp-server group acme_snmp_grp01 v3 priv
    snmp-server user acme_snmp_user acme_snmp_grp01 v3 auth sha 0123456789 priv aes 128 9876543210
    snmp-server host 40.40.40.100 version 3 priv acme_snmp_user
    snmp-server enable traps

- control_id: control_00012
  title: "Banners"
  explanation: >
    Defines legal or informative messages displayed to users when attempting to
    access the device.
  command_template: |
    banner motd $ <message_of_the_day> $
  variables:
    - message_of_the_day
  not_compliance_conditions:
    - "Banner MOTD is not configured"
    - "Banner opening and closing delimiter characters do not match, producing a malformed/incomplete banner (mechanically checked)"
    - "Banner message does not match corporate policy (manual review - wording/legal-language quality is a human judgment call)"
  exceptions:
    - "No specific exceptions identified for this control."
  severity: Medium
  risk: >
    The absence of legal banners can complicate the legal prosecution of
    unauthorized users and fails to warn attackers of monitoring.
  remediation: >
    Configure a 'banner motd' containing approved legal language regarding
    authorized access and monitoring.
  evidence: "'banner motd' section in the running configuration."
  deterministic_validation: true
  manual_review: true
  config_example: |
    banner motd $ ++This is the message of the day++ $

- control_id: control_00013
  title: "Passwords"
  explanation: >
    Applies global password security policies, including minimum length and
    encryption of keys stored in the configuration.
  command_template: |
    security passwords min-length <minimum_length_number>
    service password-encryption
  variables:
    - minimum_length_number
  not_compliance_conditions:
    - "'security passwords min-length' is not configured or below the minimum length requirement"
    - "'service password-encryption' is missing"
  exceptions:
    - "No specific exceptions identified for this control."
  severity: High
  risk: >
    Short or unencrypted passwords are easily cracked via dictionary attacks or
    discovered within the configuration file if the device is compromised.
  remediation: >
    Set a global minimum password length (at least 10) and enable the password
    encryption service.
  evidence: "'security passwords min-length' and 'service password-encryption' commands."
  deterministic_validation: true
  manual_review: false
  config_example: |
    security passwords min-length 10
    service password-encryption

- control_id: control_00014
  title: "VTY Lines"
  explanation: >
    Configures access and security parameters for console and virtual terminal
    lines, controlling direct and remote administrative access.
  command_template: |
    line con 0
     password {{ console_password }}
     login local
     exec-timeout {{ minutes }} {{ seconds }}
     logging synchronous
    !
    line aux 0
    !
    {% for r in vty_ranges %}
    line vty {{ r.start }} {{ r.end }}
     access-class {{ vty_acl_name }} in
     password {{ vty_password }}
     login authentication default
     exec-timeout {{ minutes }} {{ seconds }}
     logging synchronous
     exec prompt timestamp
     transport input {{ allowed_protocols }}
     transport output {{ allowed_protocols }}
    !
    {% endfor %}
  # Console keeps 'login local' (a working fallback if TACACS is unreachable);
  # VTY uses 'login authentication default' to invoke the AAA method list
  # control_00003 sets up - these are intentionally different, not a typo.
  # Pre-converted Jinja (not the <var> convention used by every other control),
  # same pattern as control_00004's TACACS servers: a real repeating list (the
  # corporate VTY line ranges, e.g. '0 4' and '5 15'), rendered via a
  # {% for %} loop. See GOLDEN_CONFIG_CREATOR.md section 12.
  variables:
    - console_password
    - minutes
    - seconds
    - vty_password
    - allowed_protocols
    - vty_acl_name
    - vty_ranges
  not_compliance_conditions:
    - "Console or VTY passwords are missing"
    - "Console 'login local' is missing, or VTY 'login authentication default' is missing"
    - "'exec-timeout' is missing, set to '0 0' (disables session timeout entirely), or exceeds the corporate policy maximum in the golden config"
    - "'transport input' or 'transport output' is not restricted to secure protocols"
    - "'access-class <name>' on a VTY line is missing the required 'in' direction keyword"
    - "The ACL referenced by 'access-class' does not exist in the configuration (see control_00008 for whether its content is compliant)"
  exceptions:
    - "No specific exceptions identified for this control."
  severity: High
  risk: >
    Open VTY/Console sessions without timeouts can be hijacked. Insecure protocol
    support allows for credential theft. VTY lines that bypass the configured AAA
    method list (e.g. via 'login local' instead of 'login authentication default')
    defeat centralized TACACS authentication and accounting.
  remediation: >
    Apply 'exec-timeout' and a password on all access lines; use 'login local' on
    console and 'login authentication default' on VTY; restrict transport input
    and output to secure protocols; bind VTY lines to a named ACL via
    'access-class <name> in'.
  evidence: "Configuration blocks for 'line console 0' and 'line vty', and the referenced access-list."
  deterministic_validation: true
  manual_review: false
  config_example: |
    line con 0
     password 0123456789
     login local
     exec-timeout 10 0
     logging synchronous
     exit
    line vty 0 4
     access-class ACME_VTY_MGMT_ACL in
     password 0123456789
     login authentication default
     exec-timeout 10 0
     logging synchronous
     exec prompt timestamp
     transport input ssh
     transport output ssh
     exit
    line vty 5 15
     access-class ACME_VTY_MGMT_ACL in
     password 0123456789
     login authentication default
     exec-timeout 10 0
     logging synchronous
     exec prompt timestamp
     transport input ssh
     transport output ssh
     exit

- control_id: control_00015
  title: "Local user and enable secret"
  explanation: >
    Establishes fundamental protection measures, such as the enable password and
    the creation of a local administrator with full privileges.
  command_template: |
    username <user_name> privilege 15 secret <user_password>
    enable secret <enable_password>
  variables:
    - enable_password
    - user_name
    - user_password
  not_compliance_conditions:
    - "Enable secret is missing"
    - "Enable secret is set to a weak/guessable value"
    - "Local administrator (the username line without 'algorithm-type scrypt' - see control_00005 for the emergency/break-glass user) is not created, or is not privilege 15"
    - "Local administrator username does not match the corporate standard in the golden config"
  exceptions:
    - "No specific exceptions identified for this control."
  severity: High
  risk: >
    Failure to secure the privileged mode allows any user with standard access to
    potentially take full control of the network device.
  remediation: >
    Ensure an 'enable secret' and a privilege 15 local administrator account are
    present and secured.
  evidence: "'enable secret' and 'username ... privilege 15' in configuration."
  deterministic_validation: true
  manual_review: false
  config_example: |
    username admin privilege 15 secret 0123456789
    enable secret 0123456789

- control_id: control_00016
  title: "Mandatory Commands"
  explanation: >
    Verifies presence of a baseline set of mandatory hardening commands beyond the
    individually-scoped controls above, including a Control Plane Policing (CoPP)
    service-policy applied under 'control-plane'.
  command_template: |
    control-plane
     service-policy input <copp_policy_name>
  variables:
    - copp_policy_name
  not_compliance_conditions:
    - "One or more mandatory commands from the corporate security policy baseline are absent"
    - "No 'service-policy input <policy_name>' is applied under 'control-plane' (missing Control Plane Policing)"
  exceptions:
    - "No specific exceptions identified for this control."
  severity: High
  risk: >
    Omitting baseline security commands, including CoPP, leaves the device
    vulnerable to common automated attacks, misconfigurations, and control-plane
    resource exhaustion (CPU/DoS) from unfiltered traffic.
  remediation: >
    Review and apply all commands marked as mandatory in the security policy,
    including a CoPP service-policy on the control-plane.
  evidence: "Presence of specific mandatory command strings in running config, including 'service-policy input' under 'control-plane'."
  deterministic_validation: true
  manual_review: false
  config_example: |
    control-plane
     service-policy input COPP_POLICY_ACME

- control_id: control_00017
  title: "Recommended Commands"
  explanation: >
    Implements suggested security hardening commands, such as local brute-force
    protection and robust hashing algorithms.
  command_template: |
    username <local_admin> privilege 15 algorithm-type scrypt secret <strong_password>
    login block-for <blocked_time> attempts <attempts_number> within <attempts_time>
    login delay <login_delay>
    login on-failure log
    login on-success log
    security passwords min-length <password_length>
  variables:
    - local_admin
    - strong_password
    - blocked_time
    - attempts_number
    - attempts_time
    - login_delay
    - password_length
  not_compliance_conditions:
    - "'login block-for' or 'login delay' settings are missing"
    - "'security passwords min-length' is below 10"
    - "Scrypt algorithm is not configured"
  exceptions:
    - "No specific exceptions identified for this control."
  severity: Medium
  risk: >
    Without brute-force protection, attackers can use automated scripts to guess
    local passwords without being blocked or logged.
  remediation: "Implement 'login block-for' and 'login delay' to mitigate automated login attempts."
  evidence: "'login block-for' and 'login delay' commands in configuration."
  deterministic_validation: true
  manual_review: false
  config_example: |
